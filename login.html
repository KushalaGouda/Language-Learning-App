<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - LinguaLearn</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>🌍 LinguaLearn</h1>

            <p class="login-subtitle">
                Learn languages. Build your skills.
            </p>

            <h2 id="formTitle">
                Login
            </h2>

            <form id="authForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                    class="card-button">

                    Login

                </button>

            </form>

            <p id="authMessage"></p>

            <p class="switch-text">

                Don't have an account?

                <button
                    type="button"
                    id="switchButton">

                    Create Account

                </button>

            </p>

        </div>

    </div>


    <script type="module">

        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword
        }
        from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


        import {
            app
        }
        from "./js/app.js";


        const auth = getAuth(app);


        let isLogin = true;


        const authForm =
            document.getElementById("authForm");

        const formTitle =
            document.getElementById("formTitle");

        const switchButton =
            document.getElementById("switchButton");

        const authMessage =
            document.getElementById("authMessage");


        switchButton.addEventListener(
            "click",
            function() {

                isLogin = !isLogin;

                if (isLogin) {

                    formTitle.innerText =
                        "Login";

                    authForm.querySelector(
                        "button[type='submit']"
                    ).innerText =
                        "Login";

                    switchButton.innerText =
                        "Create Account";

                    document.querySelector(
                        ".switch-text"
                    ).firstChild.textContent =
                        "Don't have an account? ";

                } else {

                    formTitle.innerText =
                        "Create Account";

                    authForm.querySelector(
                        "button[type='submit']"
                    ).innerText =
                        "Create Account";

                    switchButton.innerText =
                        "Login";

                    document.querySelector(
                        ".switch-text"
                    ).firstChild.textContent =
                        "Already have an account? ";

                }

                authMessage.innerText = "";

            }
        );


        authForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "email"
                    ).value;

                const password =
                    document.getElementById(
                        "password"
                    ).value;


                authMessage.innerText =
                    "Please wait...";


                try {

                    if (isLogin) {

                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );

                        authMessage.innerText =
                            "Login successful! 🎉";

                    } else {

                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );

                        authMessage.innerText =
                            "Account created successfully! 🎉";

                    }


                    setTimeout(
                        function() {

                            window.location.href =
                                "index.html";

                        },
                        1000
                    );


                } catch (error) {

                    console.error(error);


                    if (
                        error.code ===
                        "auth/email-already-in-use"
                    ) {

                        authMessage.innerText =
                            "This email is already registered.";

                    } else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        authMessage.innerText =
                            "Please enter a valid email.";

                    } else if (
                        error.code ===
                        "auth/weak-password"
                    ) {

                        authMessage.innerText =
                            "Password must be at least 6 characters.";

                    } else if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        authMessage.innerText =
                            "Incorrect email or password.";

                    } else {

                        authMessage.innerText =
                            error.message;

                    }

                }

            }
        );

    </script>

</body>

</html>
